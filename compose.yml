# The S3 emulator for Fil's integration tests.
#
#     docker compose up -d          # start it
#     mix test.integration          # run the suite against it
#     docker compose down -v        # stop it and delete the data
#
# The suite creates its own bucket per run, gives each test a root of its own in it and removes the bucket at the end,
# so the container can keep running between runs.

services:
  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    # The credentials `Fil.Emulator` signs with. RustFS verifies SigV4, so the suite also tests the request signing.
    environment:
      RUSTFS_ACCESS_KEY: filaccesskey
      RUSTFS_SECRET_KEY: filsecretkey
    ports:
      - "9000:9000"
