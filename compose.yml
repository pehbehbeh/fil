# The emulators for Fil's integration tests: RustFS for S3, Azurite for Azure Blob Storage.
#
#     docker compose up -d          # start them
#     mix test.integration          # run the suites against them
#     docker compose down -v        # stop them and delete the data
#
# Each suite creates its own bucket or container per run, gives each test a root of its own in it and removes it at the
# end, so the containers can keep running between runs.

services:
  rustfs:
    image: rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    # The credentials `Fil.Emulator` signs with. RustFS verifies SigV4, so the suite also tests the request signing.
    environment:
      RUSTFS_ACCESS_KEY: filaccesskey
      RUSTFS_SECRET_KEY: filsecretkey
    ports:
      - "9000:9000"
  azurite:
    # A double-quoted string can break its line with a backslash, which keeps the image within 120 columns.
    image: "mcr.microsoft.com/azure-storage/azurite:3.37.0\
      @sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5"
    # Only the blob service, with the well-known `devstoreaccount1` key `Fil.Emulator` signs with. Azurite verifies
    # Shared Key and SAS signatures, so the suite also tests the signing. `--inMemoryPersistence` keeps no data on disk.
    command: azurite-blob --blobHost 0.0.0.0 --inMemoryPersistence
    ports:
      - "10000:10000"
