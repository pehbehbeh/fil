# The S3 emulator for Fil's integration tests.
#
#     docker compose up -d          # start it
#     mix test.integration          # run the suite against it
#     docker compose down -v        # stop it and delete the data
#
# The suite creates its own bucket per run and recreates it between tests, so the container can keep running between
# runs.

services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    # Every recreated bucket gets new volumes. By default the number of volumes is free disk space divided by the volume
    # size, which ran out on the CI runner after a few hundred, so the volumes are small and their number is fixed.
    command: >-
      server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
      -master.volumeSizeLimitMB=32 -volume.max=1000
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - .docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
