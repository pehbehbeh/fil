name: Release

# Releases the branch the workflow runs on (develop, a hotfix branch or a `v0.N` maintenance branch): runs CI, bumps
# `@version` in mix.exs, turns the "Unreleased" changelog section into the version's section, merges into main,
# publishes the package and its docs to Hex, pushes the tag, creates the GitHub release and merges main back into
# develop with a fresh "Unreleased" section. Every step skips work that is already done, so a failed run can be rerun.
# See "Releasing" in AGENTS.md. Run it from the Actions tab or with `gh workflow run release.yml -f version=0.2.0`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (0.2.0)"
        required: true
        type: string

concurrency: release

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release v${{ inputs.version }}
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: checks-elixir-1.20-otp-29-${{ hashFiles('mix.lock') }}

      # A maintenance branch is released onto itself and keeps its own changelog. Everything else goes through main and
      # back into develop.
      - name: Pick the branches
        run: |
          case "$SOURCE" in
            v[0-9]*)
              echo "TARGET=$SOURCE" >> "$GITHUB_ENV"
              echo "DEVELOP=$SOURCE" >> "$GITHUB_ENV"
              ;;
            *)
              echo "TARGET=main" >> "$GITHUB_ENV"
              echo "DEVELOP=develop" >> "$GITHUB_ENV"
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check the version
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "'$VERSION' is not a version like 0.2.0"
            exit 1
          fi

          status=$(curl -s -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/fil/releases/$VERSION")
          case "$status" in
            200) echo "PUBLISHED=true" >> "$GITHUB_ENV" ;;
            404) echo "PUBLISHED=false" >> "$GITHUB_ENV" ;;
            *) echo "hex.pm answered $status for $VERSION"; exit 1 ;;
          esac

      # Skipped on a rerun that already made the release commit.
      - name: Bump the version and the changelog
        run: |
          if grep -q "^  @version \"$VERSION\"$" mix.exs && grep -Eq "^## v$VERSION( |$)" CHANGELOG.md; then
            echo "$SOURCE already has the release commit"
            exit 0
          fi

          unreleased=$(awk '/^## Unreleased/ { section = 1; next } /^## / { section = 0 } section' CHANGELOG.md)
          if ! echo "$unreleased" | grep -q '[^[:space:]]'; then
            echo "CHANGELOG.md has no entries under Unreleased"
            exit 1
          fi

          sed -i -E "s/^(  @version \")[^\"]+(\")$/\1$VERSION\2/" mix.exs
          grep -q "^  @version \"$VERSION\"$" mix.exs || { echo "couldn't set @version in mix.exs"; exit 1; }
          sed -i "s/^## Unreleased$/## v$VERSION ($(date -u +%F))/" CHANGELOG.md
          git commit -am "Release v$VERSION"
          git push origin "HEAD:$SOURCE"

      - name: Merge into ${{ env.TARGET }}
        run: |
          if [ "$TARGET" = "$SOURCE" ]; then
            exit 0
          fi
          git fetch origin "$TARGET"
          git checkout -b "$TARGET" "origin/$TARGET"
          git merge --no-ff --no-edit "$SOURCE"
          git push origin "$TARGET"

      - name: Check the changelog
        run: |
          awk -v version="$VERSION" '
            BEGIN { gsub(/\./, "\\.", version) }
            $0 ~ "^## v" version "( |$)" { section = 1; next }
            /^## / { section = 0 }
            section
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for v$VERSION"
            exit 1
          fi

      - name: Publish to Hex
        if: env.PUBLISHED == 'false'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix deps.get
          mix hex.publish --yes

      - name: Push the tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md

      - name: Merge back into ${{ env.DEVELOP }} and reopen the changelog
        run: |
          if [ "$DEVELOP" != "$TARGET" ]; then
            git fetch origin "$DEVELOP"
            git checkout -b "$DEVELOP" "origin/$DEVELOP"
            git merge --no-ff --no-edit "$TARGET"
          fi

          if ! grep -q '^## Unreleased$' CHANGELOG.md; then
            awk '/^## / && !done { print "## Unreleased"; print ""; done = 1 } { print }' CHANGELOG.md > reopened.md
            mv reopened.md CHANGELOG.md
            git commit -am "Reopen the changelog after v$VERSION"
          fi

          git push origin "$DEVELOP"
