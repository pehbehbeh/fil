name: CI

on:
  push:
    # `v[0-9]*` are maintenance branches for backports. bin/release checks the CI run of the commit it releases, so it
    # needs CI on every branch it releases from (see "Releasing" in AGENTS.md).
    branches: [main, "v[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, Credo and docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: checks-elixir-1.20-otp-29-${{ hashFiles('mix.lock') }}

      # Quokka is a formatter plugin and reads the Credo config, so the dependencies have to be compiled first.
      - run: mix deps.get
      - run: mix deps.compile
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix docs --warnings-as-errors
      - run: bin/check-changelog

  test:
    name: Test (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      # Every supported Elixir minor version (`elixir:` in mix.exs), each with the newest OTP it supports, plus the
      # oldest supported OTP on the oldest Elixir.
      matrix:
        include:
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: test-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix test

  integration:
    name: Integration (RustFS)
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: integration-elixir-1.20-otp-29-${{ hashFiles('mix.lock') }}

      # compose.yml instead of a service container, so CI and local runs use the same image and settings.
      - run: docker compose up -d

      # The container is up before RustFS answers S3 requests, so wait for an HTTP response.
      - name: Wait for RustFS
        run: |
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:9000 && exit 0
            sleep 1
          done
          echo "RustFS didn't answer within 60 seconds"
          exit 1

      - run: mix deps.get
      - run: mix test.integration

      - name: RustFS logs
        if: failure()
        run: docker compose logs rustfs

  # The one check the ruleset on `main` requires, so the ruleset doesn't change with the Elixir matrix. `always()`
  # keeps it running when a job it needs fails, because GitHub counts a skipped required check as passed.
  ci:
    name: CI passed
    if: always()
    needs: [checks, test, integration]
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if a job failed, was cancelled or was skipped
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
