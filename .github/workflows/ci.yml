name: CI

on:
  push:
    # `v[0-9]*` are maintenance branches for backports (see "Releasing" in AGENTS.md).
    branches: [main, develop, "v[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, Credo and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: checks-elixir-1.20-otp-29-${{ hashFiles('mix.lock') }}

      # Quokka is a formatter plugin and reads the Credo config, so the dependencies have to be compiled first.
      - run: mix deps.get
      - run: mix deps.compile
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix docs --warnings-as-errors

  test:
    name: Test (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Every supported Elixir minor version (`elixir:` in mix.exs), each with the newest OTP it supports, plus the
      # oldest supported OTP on the oldest Elixir.
      matrix:
        include:
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: test-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix test

  integration:
    name: Integration (SeaweedFS)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: integration-elixir-1.20-otp-29-${{ hashFiles('mix.lock') }}

      # compose.yml instead of a service container: services can't set SeaweedFS's command or mount its S3 config.
      - run: docker compose up -d

      # SeaweedFS accepts connections before it answers S3 requests, so wait for an HTTP response.
      - name: Wait for SeaweedFS
        run: |
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8333 && exit 0
            sleep 1
          done
          echo "SeaweedFS didn't answer within 60 seconds"
          exit 1

      - run: mix deps.get
      - run: mix test.integration

      - name: SeaweedFS logs
        if: failure()
        run: docker compose logs seaweedfs

  release:
    name: Release
    # Every push to main or a maintenance branch whose version isn't on Hex yet is a release: publish the package and
    # its docs, push the tag and create the GitHub release from the changelog. See "Releasing" in AGENTS.md.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
    needs: [checks, test, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: checks-elixir-1.20-otp-29-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - name: Read the version
        run: echo "VERSION=$(mix eval 'IO.puts(Mix.Project.config()[:version])')" >> "$GITHUB_ENV"

      - name: Check the changelog
        run: |
          awk -v version="$VERSION" '
            BEGIN { gsub(/\./, "\\.", version) }
            $0 ~ "^## v" version "( |$)" { section = 1; next }
            /^## / { section = 0 }
            section
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for v$VERSION"
            exit 1
          fi

          unreleased=$(awk '/^## Unreleased/ { section = 1; next } /^## / { section = 0 } section' CHANGELOG.md)
          if echo "$unreleased" | grep -q '[^[:space:]]'; then
            echo "CHANGELOG.md still has entries under Unreleased"
            exit 1
          fi

      - name: Check whether the version is on Hex
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/fil/releases/$VERSION")
          case "$status" in
            200) echo "PUBLISHED=true" >> "$GITHUB_ENV" ;;
            404) echo "PUBLISHED=false" >> "$GITHUB_ENV" ;;
            *) echo "hex.pm answered $status"; exit 1 ;;
          esac

      - name: Publish to Hex
        if: env.PUBLISHED == 'false'
        run: mix hex.publish --yes

      - name: Push the tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
